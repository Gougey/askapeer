name: Checks

# PR-time gate (the deploy workflow only runs post-merge). Keeps the web app on-system
# and type-clean before anything reaches main. No secrets required.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Guards — tokens, inputs, disclosure + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Design-token guard
        run: npm run lint:tokens -w apps/web
      # Focusable controls under 16px make iOS Safari zoom on focus, which resizes the
      # visual viewport and makes fixed panels appear to change width. Fixed one control
      # at a time twice before this guard existed.
      - name: Input-zoom guard
        run: npm run lint:inputs -w apps/web

      - name: Client boundary (no non-component imports from 'use client' modules)
        run: npm run lint:boundary -w apps/web
      # The CSS token layer is generated from packages/design-tokens. Fails if globals.css
      # was hand-edited instead, which is the one way the two could silently diverge.
      - name: Design tokens up to date
        run: npm run tokens:check
      # A member may see that they were reported and what a moderator decided — never who
      # reported them, what that person wrote, or which moderator acted. Handing a reported
      # member their reporter's handle invites retaliation. That boundary was a comment in
      # one service until this check existed.
      - name: Disclosure guard
        run: npm run lint:disclosure -w apps/api
      - name: Typecheck
        run: npm run typecheck -w apps/web
      - name: Typecheck API
        run: npm run typecheck -w apps/api
      # The classifier is a pure function, so its two load-bearing rules can be checked here
      # rather than found by reclassifying the live corpus — which is how both of them were
      # actually found. A plural must stem to what its singular stems to, and a scope term
      # must keep a shared structure out of the wrong joint.
      - name: Classifier — scope terms and stemming
        run: npm run verify:scope -w apps/api
      # The same argument: the edit window is a pure function precisely so the `canEdit` the
      # API advertises and the check it enforces cannot drift apart, and so the rule can be
      # pinned here rather than discovered by someone editing a post they should not have.
      - name: Edit window
        run: npm run verify:edit-window -w apps/api
      # And again, this time learned the expensive way. The API validates its query
      # parameters strictly, so a filter value it would refuse turns into a 400, a thrown
      # fetch and an error page. `?tag=` did exactly that to the Research feed on the day it
      # shipped, because `tag` was the one filter the page passed through unchecked.
      - name: Feed filters — nothing the API would reject leaves the URL parser
        run: npm run verify:feed-filters -w apps/web
      # The other half of the same failure. Taxonomy ids are uuid5 over the tag's path so a
      # term lands on the same id everywhere; 0045 typed nine of them by hand and four ran
      # past the legal variant nibble. Postgres accepts any 32 hex digits, so nothing caught
      # it until a member selected one and `@IsUUID` answered 400.
      - name: Tag ids — every id a migration writes is one the API accepts
        run: npm run verify:tag-ids -w apps/api
      # A backfill is a ten-hour run against two free public APIs, and they are entitled to
      # say "slow down". The first live run read that as "broken" and wrote off 67 slices —
      # 67 source-years of literature, silently, because nothing retries a failure.
      - name: Backfill — a rate limit is a wait, not a failure
        run: npm run verify:backfill-retry -w apps/api
      # The other half, and the one that killed a ten-hour import in silence: the rested-source
      # filter bound a JS array as a scalar, so every call threw once a source was actually
      # rested. Local runs never rest a source, so only the SQL itself can catch this.
      - name: Backfill — the rested-source filter binds as an array
        run: npm run verify:backfill-query -w apps/api
      # Sender reputation. The seeded demo accounts sit on reserved domains that cannot
      # resolve, and every notification to one bounced — live was at a 9.9% bounce rate, a
      # whisker under where Postmark starts acting. Real members' sign-in codes ride on that.
      - name: Email — nothing is sent to a domain that cannot exist
        run: npm run verify:undeliverable -w apps/api
