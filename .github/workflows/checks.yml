name: Checks

# PR-time gate (the deploy workflow only runs post-merge). Keeps the web app on-system
# and type-clean before anything reaches main. No secrets required.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Guards — tokens, inputs, disclosure + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Design-token guard
        run: npm run lint:tokens -w apps/web
      # Focusable controls under 16px make iOS Safari zoom on focus, which resizes the
      # visual viewport and makes fixed panels appear to change width. Fixed one control
      # at a time twice before this guard existed.
      - name: Input-zoom guard
        run: npm run lint:inputs -w apps/web
      # The CSS token layer is generated from packages/design-tokens. Fails if globals.css
      # was hand-edited instead, which is the one way the two could silently diverge.
      - name: Design tokens up to date
        run: npm run tokens:check
      # A member may see that they were reported and what a moderator decided — never who
      # reported them, what that person wrote, or which moderator acted. Handing a reported
      # member their reporter's handle invites retaliation. That boundary was a comment in
      # one service until this check existed.
      - name: Disclosure guard
        run: npm run lint:disclosure -w apps/api
      - name: Typecheck
        run: npm run typecheck -w apps/web
      - name: Typecheck API
        run: npm run typecheck -w apps/api
