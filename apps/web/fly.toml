# Fly config for the web app (staging, prove-then-migrate phase).
# Deploy from the repo root:  flyctl deploy --config apps/web/fly.toml
app = "askapeer-web"
primary_region = "lhr"

[build]
  # Relative to this config file's directory (apps/web). Deploy from the repo
  # root with the root as build context: flyctl deploy . --config apps/web/fly.toml
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  # Server-side fetches to the API (public URL auto-starts the API machine).
  API_ORIGIN = "https://askapeer-api.fly.dev"
