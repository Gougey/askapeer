# Fly config for the API (staging, prove-then-migrate phase).
# Deploy from the repo root:  flyctl deploy --config apps/api/fly.toml
app = "askapeer-api"
primary_region = "lhr"

[build]
  # Relative to this config file's directory (apps/api). Deploy from the repo
  # root with the root as build context: flyctl deploy . --config apps/api/fly.toml
  dockerfile = "Dockerfile"

[deploy]
  # Runs migrations before the new release goes live (WORKDIR = /app/apps/api).
  release_command = "node dist/db/migrate.js"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine stays up in lhr; the second still stops when idle.
  #
  # Fly Proxy stops an idle machine after several minutes, and that timeout is **not**
  # configurable — there is no idle-timeout setting in fly.toml, so the only way to avoid
  # a cold start is to keep a machine running. During active testing the API pays that
  # start twice over: the web app's server-side fetch wakes it after the web machine has
  # itself woken.
  #
  # Costs about $3.32/month at shared-cpu-1x/512mb. Revisit at the AWS migration, and drop
  # back to 0 if this staging app goes quiet for a stretch.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  # Links in emails point here. Not a secret; must match the deployed web app.
  WEB_ORIGIN = "https://askapeer-web.fly.dev"

  # EMAIL_PROVIDER and POSTMARK_TOKEN are **Fly secrets**, not declared here.
  #
  # This block used to set EMAIL_PROVIDER = "log" with a comment saying mail was logged
  # and not sent. Once the secret was set that comment was false, and a secret quietly
  # overriding a value in the file people read is a bad way to learn what the config is.
  # One place per setting: the secret is the place.
  #
  # AUTH_DEV_MAGIC_LINK is **gone**, not set to false. It exposed the sign-in token in the
  # request-link response, which meant anyone who knew an address could sign in as that
  # member — acceptable only while nothing could send email, and unacceptable the moment
  # something could. Postmark was approved on 2026-08-03, real delivery is live, and the
  # six-digit code covers the one case a link cannot (an installed app on iOS, where the
  # link opens the browser and the app keeps separate storage). NODE_ENV=production in the
  # Dockerfile, so with the flag absent the token is never exposed.

  # Staging (prove-phase) only: use the simulated register lookup + identity check,
  # and expose the stand-in Onfido capture screen (S2). Without this the pipeline
  # still runs but no identity check can ever complete, so applicants sit at
  # `pending` until the 48h timeout drops them into `needs_more_info`.
  # The AWS production target will NOT set this — with it unset the
  # simulated-callback endpoint 404s as though it were never deployed.
  VERIFICATION_SIMULATE = "true"

  # Admin console (S11a): the email allowlist that can reach /admin, now a **Fly secret**
  # rather than a value here. This repo is public, and the allowlist is a list of the
  # founders' personal email addresses — publishing those to gate an admin console is a
  # poor trade for a platform whose whole proposition is confidentiality.
  #
  #   flyctl secrets set ADMIN_EMAILS="a@x,b@y" -a askapeer-api
  #
  # Comma-separated, matched case-insensitively against members.email, resolved per
  # request — so adding or removing an admin takes effect without waiting for a token to
  # expire, though the process must restart to pick up a changed secret. Interim gate
  # until the moderator/administrator JWT claims land (S11/S13).
