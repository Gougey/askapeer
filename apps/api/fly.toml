# Fly config for the API (staging, prove-then-migrate phase).
# Deploy from the repo root:  flyctl deploy --config apps/api/fly.toml
app = "askapeer-api"
primary_region = "lhr"

[build]
  # Relative to this config file's directory (apps/api). Deploy from the repo
  # root with the root as build context: flyctl deploy . --config apps/api/fly.toml
  dockerfile = "Dockerfile"

[deploy]
  # Runs migrations before the new release goes live (WORKDIR = /app/apps/api).
  release_command = "node dist/db/migrate.js"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  # Links in emails point here. Not a secret; must match the deployed web app.
  WEB_ORIGIN = "https://askapeer-web.fly.dev"

  # Outbound mail is still LOGGED, NOT SENT. Until this is a real provider,
  # AUTH_DEV_MAGIC_LINK below cannot be turned off (nobody could sign in) and a suspended
  # member receives nothing at all. EmailModule warns about this at boot in production.
  EMAIL_PROVIDER = "log"

  # Staging (prove-phase) only: surface the magic-link token in the request-link
  # response so the auth flow is demoable before email delivery (S10). The AWS
  # production target will NOT set this.
  AUTH_DEV_MAGIC_LINK = "true"

  # Staging (prove-phase) only: use the simulated register lookup + identity check,
  # and expose the stand-in Onfido capture screen (S2). Without this the pipeline
  # still runs but no identity check can ever complete, so applicants sit at
  # `pending` until the 48h timeout drops them into `needs_more_info`.
  # The AWS production target will NOT set this — with it unset the
  # simulated-callback endpoint 404s as though it were never deployed.
  VERIFICATION_SIMULATE = "true"

  # Admin console (S11a): the email allowlist that can reach /admin, now a **Fly secret**
  # rather than a value here. This repo is public, and the allowlist is a list of the
  # founders' personal email addresses — publishing those to gate an admin console is a
  # poor trade for a platform whose whole proposition is confidentiality.
  #
  #   flyctl secrets set ADMIN_EMAILS="a@x,b@y" -a askapeer-api
  #
  # Comma-separated, matched case-insensitively against members.email, resolved per
  # request — so adding or removing an admin takes effect without waiting for a token to
  # expire, though the process must restart to pick up a changed secret. Interim gate
  # until the moderator/administrator JWT claims land (S11/S13).
